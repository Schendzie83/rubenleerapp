<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c4e6f6">
<meta name="description" content="Leren lezen, schrijven en rekenen met een graafmachine en trekker op de boerderij.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boerderij">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } body { margin: 0; font: 14px system-ui, sans-serif; } img { max-width: 100%; } [hidden] { display: none !important; }</style>
<title>Boerderij Leerspel</title>
<style>
@font-face { font-family: "Andika"; font-weight: 400; font-display: swap; src: url(fonts/andika-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Andika"; font-weight: 700; font-display: swap; src: url(fonts/andika-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Baloo 2"; font-weight: 600; font-display: swap; src: url(fonts/baloo-2-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Baloo 2"; font-weight: 800; font-display: swap; src: url(fonts/baloo-2-latin-800-normal.woff2) format("woff2"); }
</style>
<style>
/* Layout: one-screen werkplaats. Boven de opdracht, midden het bouwterrein, onder het bedieningspaneel met hendels. */
:root {
  --sky: #c4e6f6;
  --grass: #7dbb4c;
  --grass-deep: #4f8f2c;
  --sand: #e9c46a;
  --soil: #6b4a2e;
  --machine: #f7b500;
  --machine-deep: #8a6200;
  --tractor: #d63a2f;
  --ink: #2c2219;
  --ink-soft: #6a5a4a;
  --paper: #fffaf0;
  --panel: #3a332c;
  --ok: #2e8b3a;
  --font-read: "Andika", "Comic Sans MS", "Trebuchet MS", sans-serif;
  --font-show: "Baloo 2", "Andika", "Trebuchet MS", sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--sky); color: var(--ink);
  font-family: var(--font-read); font-size: 18px;
  overflow: hidden; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 4px solid #1d5fd1; outline-offset: 3px; }
.screen {
  height: 100%; display: flex; flex-direction: column; gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1100px; margin: 0 auto; box-sizing: border-box;
}

/* ---------- start ---------- */
#home { overflow-y: auto; }
.home-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.home-head h1 { font-family: var(--font-show); font-weight: 800; font-size: clamp(28px, 5vw, 44px); margin: 0; line-height: 1; flex: 1; min-width: 0; color: var(--soil); }
.stars { font-family: var(--font-show); font-weight: 800; font-size: 26px; background: var(--paper); border-radius: 999px; padding: 4px 16px; border: 3px solid var(--soil); white-space: nowrap; }
.stars svg { width: 24px; height: 24px; vertical-align: -3px; }
.parents { background: var(--paper); border: 3px solid var(--soil); border-radius: 999px; padding: 6px 16px; font-size: 16px; }
.farm { background: var(--grass); border-radius: 22px; border: 4px solid var(--grass-deep); padding: 12px 14px 14px; }
.farm h2 { font-family: var(--font-show); font-size: 22px; margin: 0 0 8px; color: #1f3d10; font-weight: 800; }
.stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; }
.sticker { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: 30px; background: var(--paper); border: 3px solid var(--grass-deep); }
.sticker.locked { background: transparent; border-style: dashed; color: #2f5a17; font-family: var(--font-show); font-size: 22px; opacity: .7; }
.next { margin-top: 10px; display: flex; align-items: center; gap: 6px; font-size: 16px; color: #1f3d10; }
.pip { width: 20px; height: 20px; border-radius: 50%; border: 3px solid #1f3d10; }
.pip.on { background: #ffd43b; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.card { background: var(--paper); border: 4px solid var(--soil); border-radius: 22px; padding: 10px 12px 12px; text-align: center; box-shadow: 0 6px 0 var(--soil); transition: transform .1s; }
.card:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--soil); }
.card svg { width: 100%; height: 120px; display: block; }
.card b { display: block; font-family: var(--font-read); font-size: 40px; line-height: 1.1; }
.card small { font-size: 15px; color: var(--ink-soft); }

/* ---------- spel ---------- */
.topbar { display: flex; align-items: center; gap: 12px; }
.back { background: var(--paper); border: 3px solid var(--soil); border-radius: 16px; width: 56px; height: 50px; display: grid; place-items: center; }
.back svg { width: 30px; height: 30px; }
.dots { flex: 1; display: flex; gap: 8px; justify-content: center; }
.dot { width: 26px; height: 20px; border-radius: 6px; background: #fff8; border: 3px solid var(--soil); }
.dot.done { background: #ffd43b; }
.dot.now { background: var(--paper); transform: scale(1.2); }
.task { background: var(--paper); border: 4px solid var(--soil); border-radius: 22px; padding: 8px 14px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; min-height: 84px; }
.pic { font-size: clamp(44px, 9vw, 68px); line-height: 1; }
.speak { width: 56px; height: 56px; border-radius: 50%; background: #1d5fd1; display: grid; place-items: center; flex: none; box-shadow: 0 4px 0 #123c85; }
.speak svg { width: 30px; height: 30px; }
.slots { display: flex; gap: 8px; }
.slot { min-width: 1.25em; height: 1.5em; padding: 0 .12em; box-sizing: border-box; border: 4px dashed var(--machine-deep); border-radius: 14px; font-size: clamp(36px, 8vw, 58px); line-height: 1.38em; text-align: center; color: #0000; background: #fff; }
.slot.ghost { color: #cbbfae; }
.slot.filled { color: var(--ink); border-style: solid; background: #fff3c4; }
.slot.next-up { border-color: #1d5fd1; }
.word { font-size: clamp(48px, 11vw, 84px); line-height: 1.1; letter-spacing: .04em; padding: 0 .2em; }
.sum { font-size: clamp(40px, 9vw, 68px); line-height: 1.1; font-variant-numeric: tabular-nums; }
.sum .q { display: inline-block; min-width: 1.2em; text-align: center; border: 4px dashed var(--machine-deep); border-radius: 14px; background: #fff; }
.sum .q.filled { border-style: solid; background: #fff3c4; }
.amount { display: flex; align-items: center; gap: 14px; }
.amount .num { font-size: clamp(52px, 11vw, 84px); line-height: 1; font-weight: 700; }
.amount .lbl { font-size: clamp(24px, 5vw, 36px); }
.five { display: grid; grid-template-columns: repeat(5, 16px); gap: 5px; }
.five i { width: 16px; height: 16px; border-radius: 50%; background: var(--sand); border: 2px solid var(--machine-deep); box-sizing: border-box; }
.scene-wrap { flex: 1; min-height: 0; border-radius: 22px; overflow: hidden; border: 4px solid var(--soil); background: var(--sky); }
#scene { width: 100%; height: 100%; display: block; }
.controls { background: var(--panel); border-radius: 22px; padding: 12px; display: flex; gap: 12px; justify-content: center; align-items: stretch;
  border: 6px solid; border-image: repeating-linear-gradient(-45deg, #f7b500 0 14px, #2c2219 14px 28px) 6; }
.ctl { flex: 1; max-width: 240px; min-height: 76px; border-radius: 18px; background: var(--paper); box-shadow: 0 6px 0 #0006; font-size: clamp(22px, 5vw, 34px); display: flex; align-items: center; justify-content: center; gap: 8px; }
.ctl:active { transform: translateY(4px); box-shadow: 0 2px 0 #0006; }
.ctl.go { background: var(--machine); flex: 1.4; font-weight: 700; }
.ctl.drive { background: #8fd16a; font-weight: 700; }
.ctl.num { font-size: clamp(38px, 9vw, 60px); font-weight: 700; font-variant-numeric: tabular-nums; }
.ctl[disabled] { opacity: .3; pointer-events: none; }
.ctl svg { width: 34px; height: 34px; flex: none; }
.shake { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.pop { animation: pop .45s; }
@keyframes pop { 40% { transform: scale(1.25); } }
.fly { position: fixed; z-index: 30; display: grid; place-items: center; background: #fffdf5; border: 3px solid var(--machine-deep); border-radius: 14px; font-family: var(--font-read); box-sizing: border-box; pointer-events: none; }
.hint-ring { animation: ring 1s infinite; }
@keyframes ring { 50% { opacity: .15; } }
.bob { animation: bob 1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(8px); } }
.heap-hit, .target, .animal { cursor: pointer; }
svg text { font-family: var(--font-read); }
svg text.emo { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.bigstar { position: fixed; left: 50%; top: 45%; z-index: 40; width: 160px; height: 160px; margin: -80px; pointer-events: none; animation: bigstar 1.3s forwards; }
@keyframes bigstar { 0% { transform: scale(0) rotate(-40deg); opacity: 0; } 35% { transform: scale(1.15) rotate(8deg); opacity: 1; } 70% { transform: scale(1) rotate(0); opacity: 1; } 100% { transform: scale(.2) translateY(-600px); opacity: 0; } }

.rek { background: var(--paper); border: 4px solid var(--soil); border-radius: 22px; padding: 8px 14px; display: flex; align-items: center; gap: 14px; }
.rek-rows { flex: 1; min-width: 0; display: grid; gap: 6px; }
.rek-row { display: flex; align-items: center; gap: 2px; background: linear-gradient(var(--soil), var(--soil)) center / 100% 4px no-repeat; }
.bead { width: clamp(24px, 6.4vw, 40px); aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--ink); flex: none; padding: 0; }
.bead.r { background: var(--tractor); }
.bead.w { background: #fff; }
.rek-gap { flex: 1; }
.rek-n { font-size: 40px; font-weight: 700; min-width: 1.4em; text-align: center; font-variant-numeric: tabular-nums; line-height: 1; }

/* ---------- beloning: graafmachine besturen ---------- */
.reward { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--machine); border: 4px solid var(--soil); border-radius: 22px; padding: 8px 16px; box-shadow: 0 6px 0 var(--soil); }
.reward svg { width: 110px; height: 80px; flex: none; }
.reward b { display: block; font-size: 30px; line-height: 1.1; }
.reward span { font-size: 17px; }
.reward.locked { background: #eee3cf; box-shadow: none; opacity: .85; }
.reward.locked svg { filter: grayscale(1); opacity: .6; }
.rewards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.wheel { width: clamp(116px, 26vw, 170px); aspect-ratio: 1; border-radius: 50%; background: #fffaf0aa; touch-action: none; }
.wheel svg { width: 100%; height: 100%; display: block; pointer-events: none; }
.pad.stack { gap: 8px; }
.tog { min-width: 96px; height: 54px; border-radius: 16px; background: var(--paper); border: 4px solid var(--ink); font-size: 17px; font-weight: 700; padding: 0 8px; }
.tog.on { background: #8fd16a; }
.pedal { width: clamp(58px, 13vw, 86px); height: clamp(100px, 21vw, 140px); border-radius: 16px; border: 4px solid var(--ink); background: #8fd16a; font-size: 20px; font-weight: 700; touch-action: none; }
.pedal.brake { background: #f0796f; }
#simInfo:empty { display: none; }
#sim { position: fixed; inset: 0; z-index: 45; background: var(--sky); touch-action: none; }
#simCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sim-top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.key { width: 84px; height: 84px; border-radius: 50%; border: 5px solid var(--ink); background: #8fd16a; font-size: 22px; font-weight: 700; flex: none; box-shadow: 0 5px 0 #0006; }
.key.on { background: #f0796f; }
.horn { background: var(--machine); display: grid; place-items: center; touch-action: none; }
.horn svg { width: 62%; height: 62%; }
.horn.down { transform: translateY(3px) scale(.94); box-shadow: 0 2px 0 #0006; }
.joy, .lev, .wheel { -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.timebar { flex: 1; height: 18px; border-radius: 9px; background: #fff8; border: 3px solid var(--soil); overflow: hidden; }
.timebar i { display: block; height: 100%; width: 100%; background: #ffd43b; }
.sim-bottom { position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.pad { display: grid; justify-items: center; gap: 4px; grid-auto-flow: row; }
.pad.two { grid-template-columns: auto auto; column-gap: 14px; }
.pad small { grid-column: 1 / -1; background: #2c2219cc; color: #fffaf0; border-radius: 999px; padding: 2px 12px; font-size: 15px; white-space: nowrap; }
.joy, .lev { position: relative; background: #1f1c19a0; border: 3px solid #fffaf0d9; box-shadow: 0 6px 18px #0004; touch-action: none; }
.joy { width: clamp(104px, 22vw, 150px); aspect-ratio: 1; border-radius: 50%; }
.lev { width: clamp(46px, 9vw, 64px); height: clamp(104px, 22vw, 150px); border-radius: 20px; }
.joy b, .lev b { position: absolute; left: 50%; top: 50%; background: var(--machine); border: 4px solid var(--ink); box-sizing: border-box; pointer-events: none; }
.joy b { width: 44%; height: 44%; margin: -22% 0 0 -22%; border-radius: 50%; }
.lev b { width: 100%; height: 34%; margin: -30% 0 0 -50%; border-radius: 14px; }

/* ---------- meegroeien ---------- */
.wl { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.wl i { font-style: normal; min-width: 22px; text-align: center; border-radius: 8px; padding: 1px 5px; background: #eee3cf; border: 2px solid #b9a98d; font-size: 16px; }
.wl i.s1 { background: #d6e6ff; border-color: #1d5fd1; }
.wl i.s2 { background: #cdeec3; border-color: var(--ok); }
.lvlmsg { text-align: center; font-size: 20px; font-weight: 700; color: var(--ok); margin: 0 0 10px; display: grid; gap: 4px; }
.lvlmsg:empty { display: none; }
.learned { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 17px; color: var(--soil); }
.learned span { background: var(--paper); border: 3px solid var(--ok); border-radius: 999px; padding: 2px 12px; }

/* ---------- lagen ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: #2c2219cc; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.sheet { background: var(--paper); border: 4px solid var(--soil); border-radius: 24px; padding: 20px; width: min(520px, 100%); box-sizing: border-box; }
.sheet h2 { font-family: var(--font-show); font-weight: 800; font-size: 34px; margin: 0 0 10px; text-align: center; text-wrap: balance; }
.done-stars { text-align: center; }
.done-stars svg { width: 44px; height: 44px; }
.newsticker { text-align: center; font-size: 22px; margin: 10px 0; }
.newsticker span { display: block; font-size: 84px; line-height: 1.1; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { flex: 1; min-height: 60px; border-radius: 16px; background: var(--machine); font-size: 24px; font-weight: 700; padding: 6px 16px; box-shadow: 0 5px 0 var(--machine-deep); }
.btn.alt { background: #8fd16a; box-shadow: 0 5px 0 var(--grass-deep); }
.btn.plain { background: #eee3cf; box-shadow: 0 5px 0 #b9a98d; font-weight: 400; font-size: 18px; min-height: 48px; }
.gate-q { text-align: center; font-size: 40px; margin: 0 0 12px; font-variant-numeric: tabular-nums; }
.gate-in { display: inline-block; min-width: 2.2em; border-bottom: 4px solid var(--soil); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.keys .btn { font-size: 26px; min-height: 56px; }
.set { display: grid; gap: 12px; font-size: 17px; -webkit-user-select: text; user-select: text; }
.set label { display: grid; gap: 4px; }
.set label.check { grid-template-columns: 26px 1fr; align-items: start; gap: 10px; }
.set input[type=checkbox] { width: 24px; height: 24px; margin: 2px 0 0; }
.set select, .set input[type=text] { font: inherit; padding: 8px 10px; border-radius: 10px; border: 2px solid var(--soil); background: #fff; color: var(--ink); width: 100%; box-sizing: border-box; }
.set small { color: var(--ink-soft); }
@media (prefers-reduced-motion: reduce) { .bob, .hint-ring { animation: none; } }
</style>
</head>
<body>

<div id="home" class="screen">
  <div class="home-head">
    <h1>Boerderij Leerspel</h1>
    <span class="stars" aria-label="sterren"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.300l7-.8z" fill="#ffd43b" stroke="#8a6200" stroke-width="1.5" stroke-linejoin="round"/></svg> <span id="starCount">0</span></span>
    <button class="parents" id="openSet">voor ouders</button>
  </div>
  <div class="cards" id="cards"></div>
  <div class="learned" id="learned" hidden></div>
  <div class="rewards" id="rewards">
    <button class="reward" id="rewardE"><svg viewBox="-85 -215 300 225" aria-hidden="true" id="rewardPic"></svg><span><b>graafmachine</b><span class="rewardTxt"></span></span></button>
    <button class="reward" id="rewardT"><svg viewBox="-95 -170 240 180" aria-hidden="true" id="rewardPicT"></svg><span><b>trekker</b><span class="rewardTxt"></span></span></button>
  </div>
  <div class="farm">
    <h2>mijn boerderij</h2>
    <div class="stickers" id="stickers"></div>
    <div class="next" id="next"></div>
  </div>
</div>

<div id="game" class="screen" hidden>
  <div class="topbar">
    <button class="back" id="back" aria-label="terug naar de boerderij"><svg viewBox="0 0 24 24"><path d="M3 11.500L12 4l9 7.500M6 10v10h4.500v-6h3v6H18V10" fill="none" stroke="#2c2219" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="dots" id="dots"></div>
    <span class="stars"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.300l7-.8z" fill="#ffd43b" stroke="#8a6200" stroke-width="1.5" stroke-linejoin="round"/></svg> <span id="starCount2">0</span></span>
  </div>
  <div class="task" id="task"></div>
  <div class="scene-wrap"><svg id="scene" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="rek" id="rek" hidden></div>
  <div class="controls" id="controls"></div>
</div>

<div id="sim" hidden>
  <canvas id="simCanvas"></canvas>
  <div class="sim-top">
    <button class="key" id="simKey">start</button>
    <button class="key horn" id="hornS" aria-label="toeter"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="4.5" cy="12" r="3" fill="#2c2219"/><path d="M7 10.2 L19.5 4.5 Q21.5 12 19.5 19.5 L7 13.8 Z" fill="#2c2219"/><path d="M21.8 8.5 q1.2 3.5 0 7" fill="none" stroke="#2c2219" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <div class="timebar" aria-label="speeltijd"><i id="simTime"></i></div>
    <span class="stars" id="simInfo"></span>
    <button class="back" id="simQuit" aria-label="stoppen en terug"><svg viewBox="0 0 24 24"><path d="M3 11.500L12 4l9 7.500M6 10v10h4.500v-6h3v6H18V10" fill="none" stroke="#2c2219" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="sim-bottom" id="ctlTrac" hidden>
    <div class="pad"><div class="wheel" id="wheel"><svg viewBox="-50 -50 100 100"><circle r="42" fill="none" stroke="#2c2219" stroke-width="11"/><path d="M-40,0 H40 M0,0 V40" stroke="#2c2219" stroke-width="9" stroke-linecap="round"/><circle r="9" fill="#f7b500" stroke="#2c2219" stroke-width="3"/></svg></div><small>stuur</small></div>
    <div class="pad stack"><button class="tog" id="gear">vooruit</button><button class="tog" id="mow">maaier uit</button></div>
    <div class="pad two"><button class="pedal brake" id="brake">rem</button><button class="pedal" id="gas">gas</button><small>pedalen</small></div>
  </div>
  <div class="sim-bottom" id="ctlExc">
    <div class="pad"><div class="joy" id="joyL"><b></b></div><small>draaien · arm</small></div>
    <div class="pad two"><div class="lev" id="levL"><b></b></div><div class="lev" id="levR"><b></b></div><small>rupsbanden</small></div>
    <div class="pad"><div class="joy" id="joyR"><b></b></div><small>giek · bak</small></div>
  </div>
</div>

<div class="overlay" id="done" hidden>
  <div class="sheet">
    <h2>klaar!</h2>
    <div class="done-stars" id="doneStars"></div>
    <div class="newsticker" id="newSticker"></div>
    <div class="lvlmsg" id="lvlMsg"></div>
    <div class="row" style="margin-bottom:12px"><button class="btn" id="goE" hidden>graafmachine</button><button class="btn" id="goT" hidden>trekker</button></div>

  tween(900, p => truck.g.setAttribute('transform', `translate(${lerp(520, 0, p)},0)`)).then(() => { if (my === runId) { G.busy = false; intro(); } });

  async function scoop() {
    if (G.busy) return;
    if (count >= maxCount) { say('De wagen is vol!'); return; }
    G.busy = true; sfx.dig();
    await arm(REST, DIG, 330);
    exc.load.setAttribute('visibility', 'visible');
    await arm(DIG, DUMP, 520);

  function takeOut() {

  }
  async function go() {
    if (G.busy) return;
    if (count === target) {

      return roundWon(`${target}! ${praise()}`, miss === 0);

    const t = count === 0 ? 'De wagen is nog leeg.' : count === 1 ? 'Er zit er 1 in.' : `Er zitten er ${count} in.`;
    say(`${t} We willen er ${target}. ${count < target ? 'Schep er nog bij.' : 'Dat is te veel. Haal er wat uit.'}`);
    if (!ghosts.childNodes.length) for (let i = 0; i < target; i++) { const [x, y] = bpos(i); el('rect', { x, y, width: 36, height: 24, rx: 11, fill: '#fff8', stroke: '#1d5fd1', 'stroke-width': 2.500, 'stroke-dasharray': '6 5' }, ghosts); }
  }
  setControls([
    { label: 'eruit', on: takeOut, keys: ['Backspace', 'ArrowLeft'] },
    { label: 'graaf', cls: 'go', on: scoop, keys: [' ', 'ArrowDown'] },
    { label: 'rij', cls: 'drive', on: go, keys: ['Enter', 'ArrowRight'] }
  ]);
}

/* ---------- spel 4: de wei (tellen, erbij, eraf) ---------- */
function gameField() {
  const my = runId, lv = S.mathLevel, an = lv === 8 ? { e: '', s: 'baal hooi', p: 'balen hooi' } : pick(ANIMALS);
  const mode = lv >= 9 ? 'keer' : lv === 3 ? 'plus' : lv === 4 ? 'min' : (lv === 5 || lv === 7 || lv === 8) ? pick(['plus', 'min']) : 'tel';
  const max = lv === 1 ? 5 : lv === 8 ? 100 : (lv === 6 || lv === 7) ? 20 : 10;
  const cap = lv === 7 ? 9 : lv === 8 ? 20 : 5, big8 = lv === 8;
  let a, b = 0, ans, wrong = false;
  if (mode === 'tel') { do { a = (lv === 6 ? 6 : 1) + rnd(max - (lv === 6 ? 5 : 0)); } while (a === G.lastA); ans = a; }
  else if (mode === 'keer') { a = lv === 9 ? pick([1, 2, 5, 10]) : 1 + rnd(10); b = 1 + rnd(10); ans = a * b; }
  else if (mode === 'plus') { a = (big8 ? 10 : 1) + rnd(max - (big8 ? 11 : 1)); b = 1 + rnd(Math.min(cap, max - a)); ans = a + b; }
  else { a = (big8 ? 11 : 2) + rnd(max - (big8 ? 11 : 1)); b = 1 + rnd(Math.min(cap, a - 1)); ans = a - b; }
  G.lastA = a;
  const nm = n => n === 1 ? an.s : an.p;
  const text = mode === 'tel' ? `Hoeveel ${an.p} zie je?`
    : mode === 'keer' ? `${a} keer ${b}. Hoeveel is dat?`
    : mode === 'plus' ? `Er ${a === 1 ? 'is' : 'zijn'} ${a} ${nm(a)}. Er ${b === 1 ? 'komt' : 'komen'} er ${b} bij. Hoeveel zijn het er samen?`
    : `Er zijn ${a} ${an.p}. Er ${b === 1 ? 'loopt' : 'lopen'} er ${b} weg. Hoeveel blijven er over?`;
  const sum = document.createElement('span'); sum.className = 'sum';
  sum.innerHTML = mode === 'tel' ? `${an.e} <span class="q">?</span>` : `${a} ${mode === 'plus' ? '+' : mode === 'keer' ? '×' : '−'} ${b} = <span class="q">?</span>`;
  task.append(sum, speakBtn(() => say(text)));
  if (S.rek && lv <= 7) showRek(max > 10 ? 2 : 1);

  scene.setAttribute('viewBox', '0 0 1000 520');
  el('rect', { x: 0, y: 0, width: 1000, height: 130, fill: '#c4e6f6' }, scene);
  el('circle', { cx: 90, cy: 50, r: 30, fill: '#ffe27a' }, scene);
  el('rect', { x: 0, y: 120, width: 1000, height: 400, fill: '#7fbf4f' }, scene);
  el('path', { d: 'M0,120 H1000 M0,100 H1000', stroke: '#fffaf0', 'stroke-width': 7 }, scene);
  for (let x = 20; x < 1000; x += 70) el('rect', { x, y: 86, width: 10, height: 48, rx: 3, fill: '#fffaf0' }, scene);
  el('path', { d: 'M760,200 V96 L860,30 L960,96 V200 Z', fill: '#c5382e', stroke: '#7d1f18', 'stroke-width': 4 }, scene);
  el('path', { d: 'M820,200 V120 H900 V200 M820,120 L900,200 M900,120 L820,200', fill: '#8f211a', stroke: '#fffaf0', 'stroke-width': 5 }, scene);
  const keer = mode === 'keer';
  const total = big8 ? 0 : keer ? a * b : mode === 'plus' ? a + b : a, big = !keer && total <= 10;
  const cols = keer ? b : 5, rowsN = Math.ceil(total / cols) || 1;
  const cw = keer ? Math.min(132, 660 / cols) : 132, rh = keer ? Math.min(86, 330 / rowsN) : 86;
  const pos = i => big ? [95 + (i % 5) * 132, 265 + Math.floor(i / 5) * 150] : [80 + (i % cols) * cw, 205 + Math.floor(i / cols) * rh - (keer ? 20 : 0)];
  const fs = big ? 84 : keer ? Math.min(58, rh * .8, cw * .8) : 58, BARN = [860, 170];
  if (big8) {
    // tientallen als stapels van tien balen, eenheden als losse balen
    const blocks = (n, x0, fill) => {
      const t = Math.floor(n / 10), o = n % 10;
      for (let i = 0; i < t; i++) {
        el('rect', { x: x0 + i * 34, y: 250, width: 28, height: 200, rx: 4, fill, stroke: '#6b4a2e', 'stroke-width': 2.500 }, scene);
        for (let k = 1; k < 10; k++) el('line', { x1: x0 + i * 34, x2: x0 + i * 34 + 28, y1: 250 + k * 20, y2: 250 + k * 20, stroke: '#6b4a2e', 'stroke-width': 1.500 }, scene);
      }
      for (let i = 0; i < o; i++) el('rect', { x: x0 + t * 34 + 6 + (i % 5) * 26, y: 430 - Math.floor(i / 5) * 26, width: 20, height: 20, rx: 4, fill, stroke: '#6b4a2e', 'stroke-width': 2.500 }, scene);
      return x0 + t * 34 + (o ? 6 + Math.min(o, 5) * 26 : 0);
    };
    const x1 = blocks(a, 40, '#e9c46a');
    el('text', { x: x1 + 32, y: 360, 'font-size': 60, 'font-weight': 700, 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: '#2c2219' }, scene).textContent = mode === 'plus' ? '+' : '−';
    blocks(b, x1 + 64, mode === 'plus' ? '#fff3c4' : '#f0a79f');
  }
  let counted = 0;
  const herd = [];
  for (let i = 0; i < total; i++) {
    const [x, y] = pos(i), g = el('g', { class: 'animal' }, scene);
    el('ellipse', { cx: 0, cy: fs * .5, rx: fs * .5, ry: fs * .13, fill: (mode === 'plus' && i >= a) ? '#ffe27a' : '#5f9a35' }, g);
    el('text', { x: 0, y: 0, 'font-size': fs, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'emo' }, g).textContent = an.e;
    const bd = el('g', { transform: `translate(${fs * .45},${-fs * .45})`, visibility: 'hidden' }, g);
    const br = Math.min(20, fs * .4);
    el('circle', { r: br, fill: '#1d5fd1' }, bd);
    const bt = el('text', { x: 0, y: 1, 'font-size': br * 1.2, 'font-weight': 700, 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: '#fff' }, bd);
    const o = { g, bd, bt, x, y, here: true, n: 0 };
    const start = (mode === 'plus' && i >= a) ? BARN : [x, y];
    g.setAttribute('transform', `translate(${start[0]},${start[1]})`);
    if (start === BARN) g.setAttribute('opacity', 0);
    g.addEventListener('click', () => {
      if (G.busy || !o.here || o.n) return;
      o.n = ++counted; bt.textContent = o.n; bd.setAttribute('visibility', 'visible'); sfx.pop(); say(String(o.n));
    });
    herd.push(o);
  }
  const resetCount = () => { counted = 0; herd.forEach(o => { o.n = 0; o.bd.setAttribute('visibility', 'hidden'); }); };

  G.busy = true;
  (async () => {
    await wait(300); if (my !== runId) return;
    say(text);
    if (mode === 'plus' || mode === 'min') {
      await wait(1900);
      const movers = mode === 'plus' ? herd.slice(a) : herd.slice(a - b);
      for (const o of movers) {
        if (my !== runId) return;
        if (mode === 'plus') { o.g.setAttribute('opacity', 1); await tween(600, p => o.g.setAttribute('transform', `translate(${lerp(BARN[0], o.x, p)},${lerp(BARN[1], o.y, p)})`)); }
        else {
          el('circle', { cx: o.x, cy: o.y + 6, r: fs * .5, fill: 'none', stroke: '#fffaf0', 'stroke-width': 4, 'stroke-dasharray': '9 8' }, scene);
          scene.appendChild(o.g);
          await tween(700, p => { o.g.setAttribute('transform', `translate(${lerp(o.x, BARN[0], p)},${lerp(o.y, BARN[1], p)})`); o.g.setAttribute('opacity', 1 - p * .9); });
          o.g.remove(); o.here = false;
        }
        sfx.pop();
      }
    }
    if (my === runId) G.busy = false;
  })();

  const set = new Set([ans]);
  const deltas = keer ? [a, -a, b, -b, 1, -1, 10, -10] : big8 ? [-10, 10, -1, 1, -2, 2] : [-2, -1, 1, 2];
  while (set.size < 3) { const c = ans + pick(deltas); if (c >= 0 && (keer || c <= max + 2)) set.add(c); }
  setControls([...set].sort((x, y) => x - y).map(v => ({
    label: String(v), cls: 'num', keys: v < 10 ? [String(v)] : [],
    on: btn => {
      if (G.busy || btn.disabled) return;
      if (v === ans) { const q = sum.querySelector('.q'); q.textContent = ans; q.classList.add('filled', 'pop'); return roundWon(`${ans}! ${praise()}`, !wrong); }
      sfx.no(); wrong = true; btn.disabled = true; btn.classList.add('shake'); resetCount();
      say('Tel nog eens. Tik op de dieren.');
    }
  })));
}
/* ---------- spel 5: schrijven (de trekker rijdt de letter) ---------- */
/* Blokletters in een vak van 60 breed: bovenlijn 0, romplijn 40, grondlijn 100, onderlijn 140. Elke letter is een rij halen in schrijfvolgorde. */
const STROKES = {
  a: ['M50,52 C42,36 10,38 10,70 C10,102 42,104 50,86', 'M50,40 L50,100'],
  b: ['M10,0 L10,100', 'M10,58 C18,36 52,38 52,70 C52,102 18,104 10,84'],

  f: ['M46,6 C34,-4 22,2 22,20 L22,100', 'M8,40 L40,40'],
  g: ['M50,54 C42,36 10,38 10,70 C10,102 42,104 50,86', 'M50,40 L50,120 C50,142 20,142 12,128'],

  l: ['M30,0 L30,100'],
  m: ['M8,40 L8,100', 'M8,60 C14,36 42,36 42,60 L42,100', 'M42,60 C48,36 76,36 76,60 L76,100'],
  n: ['M10,40 L10,100', 'M10,62 C20,36 50,36 50,62 L50,100'],
  o: ['M30,40 C4,40 4,100 30,100 C56,100 56,40 30,40'],
  p: ['M10,40 L10,140', 'M10,58 C18,36 52,38 52,70 C52,102 18,104 10,84'],
  q: ['M50,54 C42,36 10,38 10,70 C10,102 42,104 50,86', 'M50,40 L50,140'],
  r: ['M12,40 L12,100', 'M12,64 C18,44 34,38 46,44'],
  s: ['M46,50 C38,36 12,38 14,56 C16,72 46,68 46,86 C46,104 16,104 10,88'],
  t: ['M24,10 L24,84 C24,100 38,102 46,94', 'M8,40 L42,40'],
  u: ['M10,40 L10,78 C10,104 42,104 50,80', 'M50,40 L50,100'],
  v: ['M8,40 L30,100 L52,40'],
  w: ['M6,40 L24,100 L42,48 L60,100 L78,40'],
  x: ['M10,40 L50,100', 'M50,40 L10,100'],

  z: ['M10,40 L50,40 L10,100 L50,100']
};
const LW = c => (c === 'm' || c === 'w') ? 84 : 60;
function gameWrite() {
  const my = runId, L = S.readLevel;
  let txt, picW;
  const hasOpen = t => [...t].some(c => STROKES[c] && wst(c) < 2);
  if (L <= 6) {
    if (!G.deck || !G.deck.length) {
      // letters die nog niet beheerst zijn; de nieuwe letters van deze kern komen dubbel zo vaak
      const all = letters(L), nw = LEVELS[L - 1].l.split(' ');
      let p = all.filter(hasOpen); if (!p.length) p = all;
      G.deck = shuffle(p.concat(p.filter(c => nw.includes(c))));
    }
    txt = G.deck.pop(); picW = shuffle(allWords(L)).find(x => x.g[0] === txt);
  } else { picW = deck(x => x.w.length <= 5 && hasOpen(x.w)) || deck(x => x.w.length <= 5); txt = picW.w; }
  const itemChars = [...txt].filter(c => STROKES[c]);
  const pre0 = S.preMode === 'on' ? true : S.preMode === 'off' ? false : itemChars.some(c => wst(c) === 0);
  const intro = () => say(L > 6 ? `Schrijf het woord: ${txt}. Begin bij de groene stip.` : (picW ? `Schrijf de eerste letter van ${picW.w}. ` : '') + (pre0 ? 'Begin bij de groene stip en volg de pijltjes.' : 'Nu zonder spoor. Begin bij de groene stip.'));
  const wd = document.createElement('span'); wd.className = 'word'; wd.textContent = txt;
  task.append(wd);
  if (picW) { const pc = document.createElement('span'); pc.className = 'pic'; pc.textContent = picW.e; task.append(pc); }
  task.append(speakBtn(intro));

  scene.setAttribute('viewBox', '0 0 1000 520'); scene.style.touchAction = 'none';
  el('rect', { x: 0, y: 0, width: 1000, height: 520, fill: '#7fbf4f' }, scene);
  const chars = [...txt].filter(c => STROKES[c]);
  const tw = chars.reduce((s, c) => s + LW(c) + 16, -16);
  const sc = Math.min(880 / tw, 2.800), g = el('g', { transform: `translate(${(1000 - tw * sc) / 2},${262 - 70 * sc}) scale(${sc})` }, scene);
  el('path', { d: `M-30,40 H${tw + 30} M-30,100 H${tw + 30}`, stroke: '#fffaf0', 'stroke-width': 1.500, 'stroke-dasharray': '6 6', opacity: .7, fill: 'none' }, g);
  const strokes = []; let x0 = 0;
  const line = (d, x, extra) => el('path', Object.assign({ d, transform: `translate(${x},0)`, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, extra), g);
  chars.forEach(c => { STROKES[c].forEach((d, k) => strokes.push({ d, x0, k, c, road: line(d, x0, { stroke: '#f0dfb0', 'stroke-width': 18 }) })); x0 += LW(c) + 16; });
  const arrows = el('g', {}, g);
  strokes.forEach(s => {
    s.ink = line(s.d, s.x0, { stroke: '#6b4a2e', 'stroke-width': 11 });
    s.len = s.ink.getTotalLength();
    const n = Math.max(2, Math.ceil(s.len / 2)); s.pts = [];
    for (let i = 0; i <= n; i++) { const p = s.ink.getPointAtLength(s.len * i / n); s.pts.push([p.x + s.x0, p.y]); }
    s.ink.setAttribute('stroke-dasharray', `${s.len + 1} ${s.len + 1}`);
  });
  const twr = el('g', {}, g); makeTractor(twr).place(0, 0);
  // startstip met het nummer van de haal, en pijltjes in de schrijfrichting
  const dots = strokes.map(s => {
    const d = el('g', { transform: `translate(${s.pts[0][0]},${s.pts[0][1]})` }, g);
    el('circle', { r: 7.500, fill: '#2e8b3a', stroke: '#fff', 'stroke-width': 1.500 }, d);
    el('text', { x: 0, y: .5, 'font-size': 9.500, 'font-weight': 700, 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: '#fff' }, d).textContent = s.k + 1;
    return d;
  });
  let si = 0, idx = 0, down = false, shown = -1, pre = pre0, helped = false;
  const errs = {}; itemChars.forEach(c => errs[c] = 0);
  const local = e => new DOMPoint(e.clientX, e.clientY).matrixTransform(g.getScreenCTM().inverse());
  function show() {
    if (shown !== si) {
      shown = si; arrows.innerHTML = '';
      const s = strokes[si];
      const n = s && pre ? s.pts.length : 0, spots = n < 12 ? [] : n < 70 ? [9] : [9, Math.round(n * .6)];   // één pijl na de start, bij een lange haal nog één verderop
      for (const i of spots) {
        const a = s.pts[i - 1], b = s.pts[i + 1], ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
        el('path', { d: 'M-4,-4.500 L2,0 L-4,4.500', transform: `translate(${s.pts[i][0]},${s.pts[i][1]}) rotate(${ang})`, fill: 'none', stroke: '#2e8b3a', 'stroke-width': 2.600, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, arrows);
      }
      dots.forEach((d, i) => { d.setAttribute('visibility', i < si || (!pre && i > si) ? 'hidden' : 'visible'); d.setAttribute('opacity', i === si ? 1 : .4); });
    }
    strokes.forEach((o, i) => {
      o.road.setAttribute('opacity', !pre ? 0 : i === si ? 1 : .45);
      o.ink.setAttribute('stroke-dashoffset', i < si ? 0 : i > si ? o.len + 1 : (o.len + 1) * (1 - idx / (o.pts.length - 1)));
    });
    const s = strokes[Math.min(si, strokes.length - 1)], p = s.pts[si < strokes.length ? idx : s.pts.length - 1];
    twr.setAttribute('transform', `translate(${p[0] - 4},${p[1] + 15}) scale(.2)`);
  }
  function move(e) {
    if (!down || G.busy || my !== runId || si >= strokes.length) return;
    const pt = local(e);
    const s = strokes[si], last = s.pts.length - 1;
    let best = -1, bd = 26;
    for (let j = idx; j <= Math.min(last, idx + 14); j++) { const d = Math.hypot(pt.x - s.pts[j][0], pt.y - s.pts[j][1]); if (d < bd) { bd = d; best = j; } }
    if (best < 0) {
      // ver van het spoor af geraakt: telt als één fout per uitstapje
      if (idx > 3 && !s.off && Math.hypot(pt.x - s.pts[idx][0], pt.y - s.pts[idx][1]) > 40) { s.off = true; errs[s.c]++; }
      return;
    }
    s.off = false;
    idx = Math.max(idx, best);
    if (idx >= last - 1) {
      // een nieuwe haal begint pas als de vinger opnieuw wordt neergezet, net als bij een pen
      si++; idx = 0; down = false; sfx.pop(); show();
      if (si >= strokes.length) {
        if (helped) itemChars.forEach(c => { if (wst(c) >= 1) errs[c]++; });
        writeResult(errs, !pre);
        return roundWon(praise(), itemChars.every(c => !errs[c]));
      }
      return;
    }
    show();
  }
  const sig = { signal: G.ac.signal };
  scene.addEventListener('pointerdown', e => {
    e.preventDefault(); down = true;
    const s = strokes[si];
    // op de verkeerde plek begonnen (niet bij de groene stip)
    if (s && idx === 0 && !s.badStart) { const pt = local(e); if (Math.hypot(pt.x - s.pts[0][0], pt.y - s.pts[0][1]) > 32) { s.badStart = true; errs[s.c]++; } }
    move(e);
  }, sig);
  scene.addEventListener('pointermove', move, sig);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => scene.addEventListener(t, () => {
    const s = strokes[si];
    // halverwege de haal losgelaten
    if (down && s && idx > 3 && !s.lifted) { s.lifted = true; errs[s.c]++; }
    down = false;
  }, sig));
  setControls([{ label: 'opnieuw', on: () => { if (!G.busy) { si = 0; idx = 0; show(); } } }].concat(pre ? [] : [{ label: 'hulp', cls: 'go', on: () => { pre = true; helped = true; shown = -1; show(); } }]));
  show();
  setTimeout(() => { if (my === runId) intro(); }, 300);
}

/* telraam: twee rijen van tien kralen, vijf rood en vijf wit, schuiven naar links */
function showRek(rows) {
  const r = $('#rek'), ks = Array(rows).fill(0);
  const rowsEl = document.createElement('div'); rowsEl.className = 'rek-rows';
  const out = document.createElement('span'); out.className = 'rek-n';
  const sumK = () => ks.reduce((x, y) => x + y, 0);
  function draw() {
    rowsEl.innerHTML = '';
    ks.forEach((k, ri) => {
      const row = document.createElement('div'); row.className = 'rek-row';
      for (let i = 0; i <= 10; i++) {
        if (i === k) { const sp = document.createElement('span'); sp.className = 'rek-gap'; row.appendChild(sp); }
        if (i === 10) break;
        const bd = document.createElement('button'); bd.className = 'bead ' + (i < 5 ? 'r' : 'w'); bd.setAttribute('aria-label', 'kraal ' + (i + 1));
        bd.addEventListener('click', () => { ks[ri] = i < k ? i : i + 1; draw(); sfx.pop(); say(String(sumK())); });
        row.appendChild(bd);
      }
      rowsEl.appendChild(row);
    });

    else if (truck.state === 'terug') { truck.position.z = Math.min(6, truck.position.z + 9 * dt); if (truck.position.z >= 6) truck.state = ''; }
    $('#simInfo').textContent = st.load ? 'bak vol' : truck.n ? `wagen ${truck.n} van 5` : '';
    if (snd) { const t = ac.currentTime, f = 42 + 26 * Math.max(drive, armAct * .7); snd.o1.frequency.setTargetAtTime(f, t, .15); snd.o2.frequency.setTargetAtTime(f * 2, t, .15); snd.hg.gain.setTargetAtTime(armAct * .035, t, .08); }
    camH += (st.h + st.swing * .6 - camH) * Math.min(1, dt * 2);
    cam.position.set(st.x - Math.sin(camH) * 9.500 - Math.cos(camH) * 5, 8.500, st.z - Math.cos(camH) * 9.500 + Math.sin(camH) * 5);

    }
    const fx = mode === 'trac' ? tr.x : st.x, fz = mode === 'trac' ? tr.z : st.z;
    sun.position.set(fx + 14, 26, fz - 10); sun.target.position.set(fx, 0, fz); sun.target.updateMatrixWorld();
    R.render(scn, cam);
    timeLeft -= dt; $('#simTime').style.width = Math.max(0, timeLeft / (S.playMin * 60) * 100) + '%';
    if (!warned && timeLeft < 30) { warned = true; say('Nog heel even. Dan gaan we weer leren.'); }
    if (timeLeft <= 0) close(true);
  }
  function resize() { if (!open) return; const w = window.innerWidth, h = window.innerHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  function start(m) {
    if (!ok) return false;
    try { if (!built) build(); } catch (e) { return false; }
    mode = m === 'trac' ? 'trac' : 'exc'; ew.visible = mode === 'exc'; tw.visible = mode === 'trac';
    $('#ctlExc').hidden = mode !== 'exc'; $('#ctlTrac').hidden = mode !== 'trac';
    runId++; engineOff(); reset(); setEngine(false);
    timeLeft = S.playMin * 60; warned = S.playMin * 60 <= 30;
    $('#home').hidden = true; $('#game').hidden = true; $('#done').hidden = true; $('#settings').hidden = true; $('#sim').hidden = false;
    open = true; resize(); last = performance.now(); raf = requestAnimationFrame(frame);
    say(mode === 'trac' ? 'Druk op start. Zet de maaier aan en geef gas.' : 'Druk op start. Dan gaat de motor aan.');
    return true;
  }
  function close(timeUp) {
    if (!open) return;
    open = false; cancelAnimationFrame(raf); setEngine(false);
    for (const k in keys) delete keys[k];
    $('#sim').hidden = true; goHome();
    if (timeUp) say('De tijd is om. Goed gewerkt' + (S.name ? ', ' + S.name : '') + '! Nu gaan we weer leren.');
  }
  // hendels: elke hendel volgt zijn eigen vinger, zodat twee handen tegelijk kunnen sturen
  function lever(id, two, cb) {
    const elm = $(id), knob = elm.firstElementChild; let pid = null;
    const set = (x, y) => { const r = elm.clientHeight / 2 * .6; knob.style.transform = `translate(${x * r}px,${y * r}px)`; cb(x, -y); };
    const upd = e => {
      const b = elm.getBoundingClientRect(), r = b.height / 2 * .6;
      let x = two ? (e.clientX - b.left - b.width / 2) / r : 0, y = (e.clientY - b.top - b.height / 2) / r;
      const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
      set(x, y);
    };
    elm.addEventListener('pointerdown', e => { e.preventDefault(); pid = e.pointerId; try { elm.setPointerCapture(pid); } catch (er) {} upd(e); });

  }

    lever('#levL', false, (x, y) => inp.tl = y); lever('#levR', false, (x, y) => inp.tr = y);
    const wh = $('#wheel'); let wp = null, wl = 0;
    const ang = e => { const b = wh.getBoundingClientRect(); return Math.atan2(e.clientY - b.top - b.height / 2, e.clientX - b.left - b.width / 2); };
    wh.addEventListener('pointerdown', e => { e.preventDefault(); wp = e.pointerId; try { wh.setPointerCapture(wp); } catch (er) {} wl = ang(e); wHeld = true; });
    wh.addEventListener('pointermove', e => { if (e.pointerId !== wp) return; const a = ang(e); let d = a - wl; if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; wl = a; wAng = clamp(wAng + d, -2.600, 2.600); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => wh.addEventListener(t, e => { if (e.pointerId === wp) { wp = null; wHeld = false; } }));
    const pedal = (id, k) => { const b = $(id); b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (er) {} tr[k] = 1; }); ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, () => tr[k] = 0)); };
    pedal('#gas', 'gas'); pedal('#brake', 'brake');
    $('#gear').addEventListener('click', () => setGear(-tr.gear)); $('#mow').addEventListener('click', () => setMow(!tr.mow));
    $('#simKey').addEventListener('click', () => setEngine(!st.engine));
    $('#simQuit').addEventListener('click', () => close(false));
    window.addEventListener('resize', resize);
    document.addEventListener('keydown', e => { if (!open) return; if (e.key === ' ') { e.preventDefault(); if (!e.repeat) setEngine(!st.engine); return; } if (mode === 'trac' && !e.repeat) { if (e.key === 'r' || e.key === 'R') setGear(-tr.gear); if (e.key === 'm' || e.key === 'M') setMow(!tr.mow); } keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
    document.addEventListener('keyup', e => { delete keys[e.key.length === 1 ? e.key.toLowerCase() : e.key]; });
  }
  return { ok, start, get mode() { return mode; } };
})();
function useTicket(mode) {
  if (S.tickets < 1) { say(`Nog ${S.goal - S.played} ${S.goal - S.played === 1 ? 'spel' : 'spellen'}. Dan mag je rijden.`); return; }
  if (SIM.start(mode)) { S.tickets--; save(); }
}

/* ---------- start en instellingen ---------- */
function renderHome() {
  updateStars();
  document.querySelectorAll('#cards .card').forEach(b => b.hidden = !gameOn(b.dataset.id));
  const done = [!gameOn('load') && 'tellen tot 10', !gameOn('write') && 'alle letters schrijven'].filter(Boolean);
  $('#learned').hidden = !done.length;
  $('#learned').innerHTML = done.length ? 'geleerd: ' + done.map(t => `<span>${t} ✓</span>`).join('') : '';
  const left = S.goal - S.played;
  $('#rewards').hidden = !(S.goal > 0 && SIM.ok);
  document.querySelectorAll('.reward').forEach(b => b.classList.toggle('locked', S.tickets < 1));
  document.querySelectorAll('.rewardTxt').forEach(t => t.textContent = S.tickets > 0 ? 'je mag rijden!' : `nog ${left} ${left === 1 ? 'spel' : 'spellen'}`);
  const n = Math.min(STICKERS.length, Math.floor(S.stars / 5)), st = $('#stickers');
  st.innerHTML = '';
  STICKERS.forEach((e, i) => { const d = document.createElement('div'); d.className = 'sticker' + (i < n ? '' : ' locked'); d.textContent = i < n ? e : '?'; st.appendChild(d); });
  const have = S.stars % 5;
  $('#next').innerHTML = n >= STICKERS.length ? 'Je boerderij is vol. Wat een werk!' : Array.from({ length: 5 }, (_, i) => `<span class="pip${i < have ? ' on' : ''}"></span>`).join('') + `<span>nog ${5 - have} ${5 - have === 1 ? 'ster' : 'sterren'}</span>`;
}
function buildCards() {
  const defs = [
    { id: 'dig', name: 'graaf', sub: 'maak het woord', vb: '-85 -215 300 225', draw: s => makeExcavator(s).set(0, 0, 165, -70) },
    { id: 'drive', name: 'rij', sub: 'lees het woord', vb: '-95 -170 240 180', draw: s => makeTractor(s).place(0, 0) },
    { id: 'write', name: 'schrijf', sub: 'rijd de letter', vb: '-45 15 150 100', draw: s => {
      STROKES.a.forEach(d => el('path', { d, fill: 'none', stroke: '#e9c46a', 'stroke-width': 18, 'stroke-linecap': 'round' }, s));
      el('path', { d: STROKES.a[0], fill: 'none', stroke: '#6b4a2e', 'stroke-width': 10, 'stroke-linecap': 'round' }, s);
      const t = el('g', { transform: 'translate(46,101) scale(.2)' }, s); makeTractor(t).place(0, 0);
    } },
    { id: 'load', name: 'tel', sub: 'schep zand in de wagen', vb: '560 350 360 160', draw: s => { const t = makeTruck(s); for (let i = 0; i < 7; i++) el('rect', { x: 598 + (i % 5) * 39, y: 444 - 26 * (Math.floor(i / 5) + 1) + 1, width: 36, height: 24, rx: 11, fill: '#e9c46a', stroke: '#8a6200', 'stroke-width': 2.500 }, t.blobs); } },
    { id: 'field', name: 'wei', sub: 'hoeveel dieren?', vb: '0 0 300 150', draw: s => { el('rect', { x: 0, y: 95, width: 300, height: 55, rx: 12, fill: '#7fbf4f' }, s); ['🐄', '🐖', '🐑'].forEach((e, i) => el('text', { x: 60 + i * 90, y: 78, 'font-size': 70, 'text-anchor': 'middle', 'dominant-baseline': 'central', class: 'emo' }, s).textContent = e); } }
  ];
  defs.forEach(d => {
    const b = document.createElement('button'); b.className = 'card';
    const s = el('svg', { viewBox: d.vb, 'aria-hidden': 'true' }); d.draw(s);
    const n = document.createElement('b'); n.textContent = d.name;
    const sm = document.createElement('small'); sm.textContent = d.sub;
    b.dataset.id = d.id; b.append(s, n, sm); b.addEventListener('click', () => startGame(d.id));
    $('#cards').appendChild(b);
  });
}
$('#back').addEventListener('click', goHome);
$('#toFarm').addEventListener('click', goHome);
$('#again').addEventListener('click', () => startGame(G.id));
$('#rewardE').addEventListener('click', () => useTicket('exc'));
$('#rewardT').addEventListener('click', () => useTicket('trac'));
$('#goE').addEventListener('click', () => useTicket('exc'));
$('#goT').addEventListener('click', () => useTicket('trac'));
$('#freePlay').addEventListener('click', () => { if (!SIM.start('exc')) $('#freePlay').textContent = 'lukt niet op dit apparaat'; });
$('#freePlayT').addEventListener('click', () => { if (!SIM.start('trac')) $('#freePlayT').textContent = 'lukt niet op dit apparaat'; });
makeTractor($('#rewardPicT')).place(0, 0);
function hornBtn(b) {
  const low = () => !$('#sim').hidden && SIM.mode === 'exc';
  b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (er) {} b.classList.add('down'); hornOn(low()); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, () => { b.classList.remove('down'); hornOff(); }));
  b.addEventListener('click', e => { if (e.detail === 0) { hornOn(low()); setTimeout(hornOff, 350); } });
}
hornBtn($('#hornS'));
document.addEventListener('keydown', e => { if ((e.key === 'b' || e.key === 'B') && !e.repeat && !$('#sim').hidden) hornOn(!$('#sim').hidden && SIM.mode === 'exc'); });
document.addEventListener('keyup', e => { if (e.key === 'b' || e.key === 'B') hornOff(); });
makeExcavator($('#rewardPic')).set(0, 0, 165, -70);
/* oudercode: een keersom die voor het kind nog te moeilijk is */
let gateAns = 0, gateIn = '';
function gateNew() { const a = 6 + rnd(4), b = 6 + rnd(4); gateAns = a * b; gateIn = ''; $('#gateQ').textContent = `${a} × ${b} =`; $('#gateIn').textContent = '?'; }
function gateKey(k) {
  if (k === 'x') { $('#gate').hidden = true; return; }
  if (k === 'ok') { if (+gateIn === gateAns) { $('#gate').hidden = true; $('#gateOk').dispatchEvent(new Event('unlock')); } else gateNew(); return; }
  if (k === 'c') gateIn = ''; else if (gateIn.length < 3) gateIn += k;
  $('#gateIn').textContent = gateIn || '?';
}
$('#openSet').addEventListener('click', () => { gateNew(); $('#gate').hidden = false; });
$('#gateKeys').addEventListener('click', e => { const k = e.target.dataset.k; if (k) gateKey(k); });
$('#gateBack').addEventListener('click', () => gateKey('x'));
document.addEventListener('keydown', e => {
  if ($('#gate').hidden) return;
  if (/^[0-9]$/.test(e.key)) gateKey(e.key); else if (e.key === 'Enter') gateKey('ok'); else if (e.key === 'Backspace') gateKey('c'); else if (e.key === 'Escape') gateKey('x');
});
$('#gateOk').addEventListener('unlock', () => {
  $('#setName').value = S.name; $('#setWord').value = S.readLevel; $('#setMath').value = S.mathLevel; $('#setRek').checked = S.rek; $('#setPre').value = S.preMode; $('#setGhostHelp').checked = S.ghostHelp;
  $('#setAuto').checked = S.auto; $('#setMax').value = S.readMax; $('#setHide').checked = S.hideDone; $('#setGhost').value = S.ghostMode;
  const pool = writePool(S.readLevel), n1 = pool.filter(c => wst(c) === 1).length, n2 = pool.filter(c => wst(c) === 2).length;
  $('#statWrite').textContent = `${pool.length} letters: ${n2} beheerst, ${n1} oefent zonder spoor, ${pool.length - n1 - n2} nog met spoor.`;
  $('#wrLetters').innerHTML = pool.map(c => `<i class="s${wst(c)}">${c}</i>`).join('');
  $('#setGoal').value = S.goal; $('#setMin').value = S.playMin;
  const stat = (h, top, capped) => {
    if (h.length < 4) return 'Na een paar opdrachten op dit niveau staat hier hoe het gaat.';
    const k = h.reduce((x, y) => x + y, 0), r = k / h.length;
    return `Op dit niveau: ${k} van de ${h.length} in één keer goed.` + (capped && r >= .85 ? ' Hoger gaat pas als u "niet hoger dan" verhoogt.' : S.auto ? '' : r >= .85 && !top ? ' Het volgende niveau kan geprobeerd worden.' : r < .5 ? ' Een niveau lager geeft meer succes.' : '');
  };
  $('#statRead').textContent = stat(S.hist.read, S.readLevel >= LEVELS.length, S.readLevel >= S.readMax && S.readLevel < LEVELS.length);
  $('#statMath').textContent = stat(S.hist.math, S.mathLevel >= MATH.length);
  $('#setSpeech').checked = S.speech; $('#setSound').checked = S.sound; $('#setKlank').checked = S.klank;
  $('#resetBtn').textContent = 'sterren wissen'; $('#resetWr').textContent = 'schrijven opnieuw'; delete $('#resetWr').dataset.sure; $('#settings').hidden = false;
});
$('#closeSet').addEventListener('click', () => {
  let rl = +$('#setWord').value, mx = +$('#setMax').value; const ml = +$('#setMath').value;
  if (rl > mx) { if (rl !== S.readLevel) mx = rl; else rl = mx; }
  S.readMax = mx; S.auto = $('#setAuto').checked; S.hideDone = $('#setHide').checked; S.preMode = $('#setPre').value; S.ghostMode = $('#setGhost').value;
  if (rl !== S.readLevel) S.hist.read = [];
  if (ml !== S.mathLevel) S.hist.math = [];
  S.name = $('#setName').value.trim(); S.readLevel = rl; S.mathLevel = ml; S.rek = $('#setRek').checked; S.ghostHelp = $('#setGhostHelp').checked;
  S.goal = +$('#setGoal').value; S.playMin = +$('#setMin').value; S.played = Math.min(S.played, Math.max(0, S.goal - 1));
  S.speech = $('#setSpeech').checked; S.sound = $('#setSound').checked; S.klank = $('#setKlank').checked;
  save(); $('#settings').hidden = true; renderHome();
});
$('#resetWr').addEventListener('click', e => {
  if (e.target.dataset.sure) { S.wr = {}; S.digFree = false; S.digRun = []; save(); delete e.target.dataset.sure; e.target.textContent = 'gewist'; $('#wrLetters').innerHTML = ''; renderHome(); }
  else { e.target.dataset.sure = 1; e.target.textContent = 'zeker weten? tik nog eens'; }
});
$('#resetBtn').addEventListener('click', e => {
  if (e.target.dataset.sure) { S.stars = 0; save(); delete e.target.dataset.sure; e.target.textContent = 'gewist'; renderHome(); }
  else { e.target.dataset.sure = 1; e.target.textContent = 'zeker weten? tik nog eens'; }
});
if (!S.hist || !S.hist.read || !S.hist.math) S.hist = { read: [], math: [] };
S.readLevel = Math.min(LEVELS.length, Math.max(1, S.readLevel | 0)); S.mathLevel = Math.min(MATH.length, Math.max(1, S.mathLevel | 0));
if (!S.wr || typeof S.wr !== 'object') S.wr = {};
if (!Array.isArray(S.digRun)) S.digRun = [];

if (!['auto', 'on', 'off'].includes(S.ghostMode)) S.ghostMode = 'auto';

})();
